<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhạc tiệc cưới</title>
<style>
  :root {
    --bg:#0b1120; --panel:#111a2e; --card:#17213a; --line:#243049;
    --text:#e8edf7; --mute:#8d9bb5; --acc:#f43f5e; --acc2:#fb923c; --ok:#22c55e; --gold:#fbbf24;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui,"Segoe UI",sans-serif; color:var(--text); background:var(--bg);
         display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:var(--card); border-radius:10px;
           padding:9px 14px; transition:background .15s, transform .05s; }
  button:hover { background:#22304f; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; cursor:default; }
  button.main { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:600; }
  button.main:hover { filter:brightness(1.08); }

  .topbar { display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--panel);
            border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .topbar h1 { margin:0; font-size:19px; flex:1; min-width:170px; white-space:nowrap; }
  .search { position:relative; }
  .search input { width:260px; max-width:100%; padding:9px 12px 9px 34px; border-radius:10px; border:1px solid var(--line);
                  background:var(--bg); color:var(--text); font-size:14px; outline:none; }
  .search input:focus { border-color:var(--acc); }
  .search span { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--mute); font-size:14px; }

  .layout { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:16px; padding:16px 20px 20px; }
  .library { min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--line); }
  .chip { padding:5px 11px; border-radius:999px; background:var(--card); font-size:12px; cursor:pointer; border:1px solid var(--line); color:var(--mute); }
  .chip:hover { color:var(--text); border-color:var(--acc); }
  #main { flex:1; min-height:0; overflow-y:auto; padding:6px 14px 16px; scroll-behavior:smooth; }
  #main::-webkit-scrollbar { width:8px; }
  #main::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }

  section { margin-top:14px; scroll-margin-top:6px; }
  .sec-head { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; cursor:pointer;
              background:var(--card); border:1px solid var(--line); user-select:none; }
  .sec-head:hover { border-color:#34456a; }
  .sec-head .caret { color:var(--mute); transition:transform .15s; font-size:11px; }
  section.closed .caret { transform:rotate(-90deg); }
  .sec-head .nm { flex:1; font-weight:600; color:var(--gold); }
  .sec-head small { color:var(--mute); }
  .sec-head .go { padding:4px 10px; font-size:12px; background:var(--bg); }
  section.closed .songs { display:none; }
  .songs { margin-top:6px; }

  .song { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
  .song:hover { background:var(--card); }
  .song .num { width:24px; text-align:center; color:var(--mute); font-size:13px; }
  .song .t { flex:1; word-break:break-word; }
  .song .eq { display:none; width:24px; height:16px; align-items:flex-end; justify-content:center; gap:2px; }
  .eq i { width:3px; background:var(--ok); border-radius:1px; animation:eq 0.9s infinite ease-in-out; height:30%; }
  .eq i:nth-child(2) { animation-delay:.2s; } .eq i:nth-child(3) { animation-delay:.4s; }
  @keyframes eq { 0%,100% { height:25%; } 50% { height:100%; } }
  .song.playing { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.45); }
  .song.playing .num { display:none; }
  .song.playing .eq { display:flex; }
  .song.playing.paused .eq i { animation-play-state:paused; }
  .song.playing .t { color:#86efac; font-weight:600; }

  .warn { background:#7f1d1d; padding:14px; border-radius:10px; margin-top:14px; }
  .empty { color:var(--mute); text-align:center; margin-top:50px; }

  .deck { min-height:0; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px;
          display:flex; flex-direction:column; gap:18px; }
  .disc { width:170px; height:170px; margin:4px auto 0; border-radius:50%;
          background:radial-gradient(circle at 50% 50%, var(--bg) 0 14%, transparent 15%),
                     conic-gradient(from 0deg, #f43f5e, #fb923c, #fbbf24, #22c55e, #38bdf8, #a78bfa, #f43f5e);
          box-shadow:0 10px 40px rgba(244,63,94,.25);
          animation:spin 6s linear infinite; animation-play-state:paused; }
  .disc.on { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .meta { text-align:center; min-height:56px; }
  #now { font-size:18px; font-weight:700; word-break:break-word; }
  #nowSub { color:var(--mute); font-size:13px; margin-top:4px; }

  .seek { display:grid; grid-template-columns:42px 1fr 42px; align-items:center; gap:8px; font-size:12px; color:var(--mute); }
  .seek span:last-child { text-align:right; }

  input[type=range].rg { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; outline:none; cursor:pointer;
                         background:linear-gradient(to right,var(--acc) var(--p,0%),#2a3858 var(--p,0%)); }
  .rg::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; border:0; }
  .rg::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:0; }
  .rg::-moz-range-track { background:transparent; }

  .transport { display:flex; align-items:center; justify-content:center; gap:14px; }
  .transport button { width:54px; height:54px; border-radius:50%; font-size:20px; padding:0; display:flex; align-items:center; justify-content:center; }
  .transport button.play { width:74px; height:74px; font-size:28px; box-shadow:0 8px 24px rgba(244,63,94,.35); }

  .extra { display:flex; gap:8px; }
  .extra button { flex:1; font-size:13px; }

  .lbl { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg button { font-size:13px; text-align:left; padding:10px 12px; background:var(--bg); border:1px solid var(--line); }
  .seg button.on { background:rgba(244,63,94,.15); border-color:var(--acc); color:#fff; }
  .seg button:last-child:nth-child(odd) { grid-column:span 2; }

  .vol { display:grid; grid-template-columns:38px 1fr 38px; align-items:center; gap:8px; }
  .vol button { padding:6px; background:var(--bg); }
  .vol span { font-size:12px; color:var(--mute); text-align:right; }

  .off { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .offbar { height:8px; background:#2a3858; border-radius:4px; overflow:hidden; }
  #offFill { height:100%; width:0; background:linear-gradient(90deg,var(--ok),#4ade80); transition:width .3s; }
  #offTxt { font-size:13px; color:var(--mute); margin:8px 0; }
  #offTxt.ok { color:#86efac; }
  #offTxt.bad { color:#fca5a5; }
  .off button { width:100%; font-size:13px; }
  .hint { font-size:12px; color:var(--mute); text-align:center; margin-top:auto; }

  @media (max-width: 880px) {
    .layout { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); padding:10px; gap:10px; }
    .deck { order:-1; padding:14px; gap:12px; overflow:visible; max-height:55dvh; overflow-y:auto; }
    .disc { display:none; }
    .hint { display:none; }
    .search input { width:100%; }
    .search { flex:1; min-width:160px; }
  }
    /* Không cho các khối bị ép nhỏ; panel tự cuộn khi thiếu chỗ */
  .deck > * { flex-shrink:0; }
  .disc { aspect-ratio:1/1; }

  /* Màn hình thấp: thu nhỏ đĩa nhạc để chừa chỗ cho các nút */
  @media (max-height: 820px) {
    .disc { width:110px; height:110px; margin-top:0; }
  }
  @media (max-height: 640px) {
    .disc { display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🎶 Nhạc tiệc cưới</h1>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Tìm bài hát..."></div>
  <button id="refresh" title="Tải lại danh sách bài hát">↻ Cập nhật</button>
</div>

<div class="layout">
  <div class="library">
    <div class="chips" id="chips"></div>
    <div id="main"></div>
  </div>

  <aside class="deck">
    <div class="disc" id="disc"></div>
    <div class="meta">
      <div id="now">Chưa chọn bài</div>
      <div id="nowSub">Chọn một bài ở danh sách bên trái</div>
    </div>

    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" class="rg" type="range" min="0" max="0" value="0" step="1">
      <span id="dur">0:00</span>
    </div>

    <div class="transport">
      <button id="prev" title="Bài trước (←)">⏮</button>
      <button id="toggle" class="main play" title="Phát / Tạm dừng (Space)">▶</button>
      <button id="next" title="Bài sau (→)">⏭</button>
    </div>

    <div class="extra">
      <button id="stop">⏹ Dừng hẳn</button>
      <button id="fade" title="Nhỏ dần rồi dừng trong 3 giây">🔉 Nhỏ dần &amp; dừng</button>
    </div>

    <div>
      <div class="lbl">Khi hết bài</div>
      <div class="seg" id="seg">
        <button data-mode="stop" class="on">⏹ Dừng lại</button>
        <button data-mode="next">➡ Bài kế tiếp</button>
        <button data-mode="folder">🔁 Lặp cả thư mục</button>
        <button data-mode="shuffle">🔀 Ngẫu nhiên</button>
        <button data-mode="loop">🔂 Lặp lại bài này</button>
      </div>
    </div>

    <div>
      <div class="lbl">Âm lượng</div>
      <div class="vol">
        <button id="mute" title="Tắt/bật tiếng">🔊</button>
        <input id="vol" class="rg" type="range" min="0" max="1" step="0.01" value="1">
        <span id="volv">100%</span>
      </div>
    </div>

    <div>
      <div class="lbl">Dùng offline</div>
      <div class="off">
        <div class="offbar"><div id="offFill"></div></div>
        <div id="offTxt">Đang kiểm tra...</div>
        <button id="offBtn">⬇ Tải các bài còn thiếu</button>
      </div>
    </div>

    <div class="hint">Phím tắt: Space phát/tạm dừng · ← → đổi bài</div>
  </aside>
</div>

<script>
// Đặt false nếu không muốn tự tải toàn bộ bài hát khi mở trang (ví dụ đang dùng 4G)
const AUTO_PRELOAD = true;
const AUDIO_CACHE = "audio-v1";

const $ = s => document.querySelector(s);
const audio = new Audio();
let sections = [];
let cur = null;           // {s, i, name, file}
let vol = 1;
let fadeTimer = null;
let mode = "stop";
let bag = [];
let bagFolder = null;
const closed = new Set();

const fmt = t => {
  if (!isFinite(t)) return "0:00";
  t = Math.floor(t);
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
};
const setFill = (el, pct) => el.style.setProperty("--p", pct + "%");
const absUrl = rel => new URL(rel, location.href).href;

async function load() {
  let data;
  try {
    const res = await fetch("library.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    $("#main").innerHTML = "";
    $("#chips").innerHTML = "";
    const d = document.createElement("div");
    d.className = "warn";
    d.textContent = "Không tải được library.json (" + e.message + "). Hãy chạy build.py và đẩy file lên lại.";
    $("#main").appendChild(d);
    return false;
  }
  sections = data.sections || [];
  bag = [];
  if (cur) {
    const si = sections.findIndex(s => s.name === cur.name);
    const ii = si < 0 ? -1 : sections[si].songs.findIndex(x => x.title === cur.file);
    cur = ii < 0 ? null : { s: si, i: ii, name: cur.name, file: cur.file };
  }
  render();
  return true;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const main = $("#main");
  const chips = $("#chips");
  const keepScroll = main.scrollTop;
  main.innerHTML = "";
  chips.innerHTML = "";
  let shown = 0;

  sections.forEach((sec, si) => {
    const songs = sec.songs.map((s, i) => ({ s, i }))
      .filter(x => !q || x.s.title.toLowerCase().includes(q) || sec.name.toLowerCase().includes(q));
    if (!songs.length) return;
    shown++;

    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = sec.name.replace(/^Nhạc\s+/i, "");
    chip.onclick = () => {
      closed.delete(sec.name);
      render();
      document.getElementById("sec-" + si).scrollIntoView({ behavior: "smooth", block: "start" });
    };
    chips.appendChild(chip);

    const el = document.createElement("section");
    el.id = "sec-" + si;
    if (!q && closed.has(sec.name)) el.classList.add("closed");

    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = '<span class="caret">▼</span><span class="nm"></span><small></small><button class="go" title="Phát bài đầu tiên của mục này">▶ Phát</button>';
    head.querySelector(".nm").textContent = sec.name;
    head.querySelector("small").textContent = sec.songs.length + " bài";
    head.onclick = () => {
      if (closed.has(sec.name)) closed.delete(sec.name); else closed.add(sec.name);
      el.classList.toggle("closed");
    };
    head.querySelector(".go").onclick = e => { e.stopPropagation(); play(si, 0); };
    el.appendChild(head);

    const wrap = document.createElement("div");
    wrap.className = "songs";
    songs.forEach(({ s, i }) => {
      const row = document.createElement("div");
      row.className = "song";
      row.dataset.s = si;
      row.dataset.i = i;
      row.innerHTML = '<span class="num"></span><span class="eq"><i></i><i></i><i></i></span><span class="t"></span>';
      row.querySelector(".num").textContent = i + 1;
      row.querySelector(".t").textContent = s.title;
      row.onclick = () => play(si, i);
      wrap.appendChild(row);
    });
    el.appendChild(wrap);
    main.appendChild(el);
  });

  if (!shown) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = q ? "Không tìm thấy bài nào." : "Chưa có bài hát nào.";
    main.appendChild(d);
  }
  main.scrollTop = keepScroll;
  markPlaying();
}

function markPlaying() {
  document.querySelectorAll(".song").forEach(r => {
    const on = cur && +r.dataset.s === cur.s && +r.dataset.i === cur.i;
    r.classList.toggle("playing", on);
    r.classList.toggle("paused", on && audio.paused);
  });
  $("#toggle").textContent = audio.paused ? "▶" : "⏸";
  $("#disc").classList.toggle("on", !audio.paused && !!cur);
}

function stopFade() {
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  audio.volume = vol;
}

function play(si, i) {
  stopFade();
  const sec = sections[si];
  const song = sec.songs[i];
  cur = { s: si, i: i, name: sec.name, file: song.title };
  audio.src = song.url;
  audio.volume = vol;
  audio.play().catch(e => alert("Không phát được: " + e.message));
  $("#now").textContent = song.title;
  $("#nowSub").textContent = sec.name + " · bài " + (i + 1) + "/" + sec.songs.length;
  markPlaying();
  const row = document.querySelector('.song[data-s="' + si + '"][data-i="' + i + '"]');
  if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function step(dir) {
  if (!cur) return;
  const n = sections[cur.s].songs.length;
  const ni = cur.i + dir;
  if (ni >= 0 && ni < n) play(cur.s, ni);
}

function pickRandom() {
  const n = sections[cur.s].songs.length;
  if (n <= 1) return cur.i;
  if (bagFolder !== cur.name || !bag.length) {
    bagFolder = cur.name;
    bag = [...Array(n).keys()].filter(i => i !== cur.i);
  }
  const k = Math.floor(Math.random() * bag.length);
  return bag.splice(k, 1)[0];
}

function goNext() {
  if (!cur) return;
  if (mode === "shuffle") play(cur.s, pickRandom());
  else step(1);
}

$("#toggle").onclick = () => {
  if (!cur) {
    if (sections.length) play(0, 0);
    return;
  }
  stopFade();
  audio.paused ? audio.play() : audio.pause();
};
$("#stop").onclick = () => { stopFade(); audio.pause(); audio.currentTime = 0; };
$("#next").onclick = goNext;
$("#prev").onclick = () => step(-1);

$("#fade").onclick = () => {
  if (audio.paused) return;
  if (fadeTimer) clearInterval(fadeTimer);
  const start = audio.volume;
  const steps = 30;
  let n = 0;
  fadeTimer = setInterval(() => {
    n++;
    audio.volume = Math.max(0, start * (1 - n / steps));
    if (n >= steps) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      audio.pause();
      audio.currentTime = 0;
      audio.volume = vol;
    }
  }, 100);
};

document.querySelectorAll("#seg button").forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
    bag = [];
  };
});

function updVol() {
  setFill($("#vol"), vol * 100);
  $("#volv").textContent = Math.round(vol * 100) + "%";
  $("#mute").textContent = audio.muted || vol === 0 ? "🔇" : "🔊";
}
$("#vol").oninput = e => {
  vol = +e.target.value;
  if (!fadeTimer) audio.volume = vol;
  updVol();
};
$("#mute").onclick = () => { audio.muted = !audio.muted; updVol(); };
updVol();

$("#seek").oninput = e => { audio.currentTime = +e.target.value; };
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 0;
  $("#seek").max = d;
  $("#seek").value = audio.currentTime;
  setFill($("#seek"), d ? audio.currentTime * 100 / d : 0);
  $("#cur").textContent = fmt(audio.currentTime);
  $("#dur").textContent = fmt(d);
});
audio.addEventListener("play", markPlaying);
audio.addEventListener("pause", markPlaying);
audio.addEventListener("ended", () => {
  if (!cur) return;
  const n = sections[cur.s].songs.length;
  if (mode === "loop") play(cur.s, cur.i);
  else if (mode === "next") step(1);
  else if (mode === "folder") play(cur.s, cur.i + 1 < n ? cur.i + 1 : 0);
  else if (mode === "shuffle") play(cur.s, pickRandom());
  markPlaying();
});
audio.addEventListener("error", () => {
  if (cur) $("#nowSub").textContent = "Không mở được bài này (chưa tải xong và đang mất mạng?)";
});

$("#q").oninput = render;

document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); $("#toggle").click(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); goNext(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); step(-1); }
});

/* ===== Tải sẵn toàn bộ bài hát để dùng offline ===== */
let preloading = false;

function offUI(text, pct, cls) {
  $("#offTxt").textContent = text;
  $("#offTxt").className = cls || "";
  $("#offFill").style.width = pct + "%";
}

async function preload() {
  if (preloading) return;
  if (!("caches" in window)) {
    offUI("Trình duyệt này không hỗ trợ lưu offline.", 0, "bad");
    return;
  }
  const all = sections.flatMap(s => s.songs.map(x => ({ url: absUrl(x.url), size: x.size || 0 })));
  if (!all.length) { offUI("Chưa có bài hát nào.", 0); return; }

  preloading = true;
  $("#offBtn").disabled = true;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    const cache = await caches.open(AUDIO_CACHE);

    // Xóa các bài không còn trong danh sách
    const keep = new Set(all.map(x => x.url));
    for (const req of await cache.keys()) {
      if (!keep.has(req.url)) await cache.delete(req);
    }

    let done = 0, failed = 0;
    const todo = [];
    for (const x of all) {
      if (await cache.match(x.url)) done++; else todo.push(x);
    }
    const total = all.length;
    const show = () => offUI(
      "Đang tải offline " + done + "/" + total + " bài" + (failed ? " (" + failed + " lỗi)" : "") + "...",
      done * 100 / total
    );
    if (todo.length) show();

    let idx = 0;
    async function worker() {
      while (idx < todo.length) {
        const x = todo[idx++];
        try {
          const r = await fetch(x.url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          await cache.put(x.url, r);
          done++;
        } catch (e) { failed++; }
        show();
      }
    }
    await Promise.all([worker(), worker(), worker()]);

    const mb = all.reduce((a, x) => a + x.size, 0) / 1024 / 1024;
    if (done === total) {
      offUI("✅ Đã tải đủ " + total + " bài (~" + Math.round(mb) + " MB). Dùng được cả khi mất mạng.", 100, "ok");
    } else {
      offUI("Mới tải " + done + "/" + total + " bài, còn " + (total - done) + " bài chưa tải. Kiểm tra mạng rồi bấm tải lại.", done * 100 / total, "bad");
    }
  } catch (e) {
    offUI("Lỗi khi tải offline: " + e.message, 0, "bad");
  } finally {
    preloading = false;
    $("#offBtn").disabled = false;
  }
}

$("#offBtn").onclick = preload;
$("#refresh").onclick = async () => { if (await load()) preload(); };

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

(async () => {
  const ok = await load();
  if (!ok) { offUI("Không có danh sách bài hát.", 0, "bad"); return; }
  if (AUTO_PRELOAD) preload();
  else offUI("Chưa tải offline. Bấm nút bên dưới để tải toàn bộ bài hát.", 0);
})();
</script>
</body>
